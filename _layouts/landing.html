<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/landing.css' | relative_url }}"
    />
  </head>
  <body class="landing">
    <script>document.documentElement.classList.add("js");</script>
    <header class="nav">
      <a class="nav__brand" href="#top">{{ site.title }}</a>
      <nav class="nav__links" aria-label="Main">
        <a href="#work">My apps</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="top">{{ content }}</main>

    <footer class="footer">
      <p>
        &copy; {{ 'now' | date: '%Y' }} {{ site.author | default: site.title }}.
      </p>
    </footer>
    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var hero = document.getElementById("hero");
        if (reduce) {
          document.querySelectorAll(".section").forEach(function (s) { s.classList.add("is-visible"); });
          return;
        }
        // hero: --p = scroll progress (0..1) over the first ~70% of the hero
        var ticking = false;
        function update() {
          var p = Math.min(Math.max(window.scrollY / (hero.offsetHeight * 0.7), 0), 1);
          hero.style.setProperty("--p", p.toFixed(3));
          ticking = false;
        }
        window.addEventListener("scroll", function () {
          if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        update();

        // sections: fade up on entering the viewport
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("is-visible"); io.unobserve(e.target); }
          });
        }, { threshold: 0.15 });
        document.querySelectorAll(".section").forEach(function (s) { io.observe(s); });
      })();
    </script>
  </body>
</html>
